<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конспект</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f4f4f7);
    --text: var(--tg-theme-text-color, #101014);
    --muted: var(--tg-theme-hint-color, #6b6b73);
    --accent: var(--tg-theme-button-color, #2f6fed);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--muted) 22%, transparent);
    --raised: color-mix(in srgb, var(--text) 5%, var(--card));
    --ok: #2f9e63;
    --warn: #c9821f;
    --bad: #d3453c;
    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 10px;
    --tap: 44px;
    --z-nav: 30;
    /* У повноекранному режимі шапка Telegram лежить поверх сторінки. */
    --safe-top: 0px;
    --safe-bottom: 0px;
    /* Читабельна колонка: на моніторі рядок на всю ширину читати неможливо. */
    --shell: 720px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding-top: var(--safe-top);
    padding-bottom: calc(84px + var(--safe-bottom) + env(safe-area-inset-bottom));
    overflow-x: hidden;
  }
  header, main { max-width: var(--shell); margin-inline: auto; }
  button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
  button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm);
  }

  /* ---------- header ---------- */
  header { padding: 18px 16px 6px; position: relative; }
  .screen-toggle {
    position: absolute; right: 12px; top: 14px;
    width: var(--tap); height: var(--tap); border-radius: 50%;
    display: grid; place-items: center; color: var(--muted);
    background: color-mix(in srgb, var(--text) 6%, transparent);
    transition: color 200ms ease, background-color 200ms ease;
  }
  .screen-toggle svg { width: 19px; height: 19px; stroke-width: 2; }
  .screen-toggle:active { color: var(--accent); }
  .screen-toggle[hidden] { display: none; }
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 13px; font-weight: 500;
  }
  .badge {
    padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent);
  }
  h1 { font-size: 26px; line-height: 1.15; margin: 4px 0 0; letter-spacing: -0.02em; }
  main { padding: 0 16px; }

  /* ---------- cards ---------- */
  .card {
    background: var(--card); border-radius: var(--r-lg); padding: 16px; margin: 12px 0;
  }
  .card h2 {
    font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 12px;
  }
  .card.flat { background: none; padding: 0; }

  /* ---------- week strip ---------- */
  .week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .day {
    min-height: var(--tap); padding: 8px 2px 9px; border-radius: var(--r-md);
    background: var(--card); display: grid; justify-items: center; gap: 5px;
    transition: background 180ms ease, color 180ms ease;
  }
  .day .name { font-size: 12px; font-weight: 600; color: var(--muted); }
  .day .num { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .day .dots { display: flex; gap: 3px; height: 4px; }
  .day .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); opacity: .5; }
  .day.today { background: var(--accent); color: var(--accent-text); }
  .day.today .name { color: color-mix(in srgb, var(--accent-text) 80%, transparent); }
  .day.today .dots i { background: var(--accent-text); opacity: .8; }
  .day.picked:not(.today) { background: color-mix(in srgb, var(--accent) 16%, var(--card)); }
  .day.empty .num { opacity: .4; }

  /* ---------- timeline ---------- */
  .tl { position: relative; padding-left: 62px; }
  .tl::before {
    content: ""; position: absolute; left: 55px; top: 8px; bottom: 8px;
    width: 2px; background: var(--line); border-radius: 1px;
  }
  .slot { position: relative; margin: 0 0 10px; }
  .slot .at {
    position: absolute; left: -62px; top: 14px; width: 46px; text-align: right;
    font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted);
  }
  .slot .knot {
    position: absolute; left: -11px; top: 18px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--subject, var(--muted));
  }
  .lesson {
    background: var(--card); border-radius: var(--r-md); padding: 12px 14px;
    border-left: 3px solid var(--subject, var(--muted));
  }
  .lesson .name { font-weight: 600; line-height: 1.3; }
  .lesson .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .slot.past .lesson { opacity: .55; }
  .slot.live .knot { background: var(--subject); box-shadow: 0 0 0 4px color-mix(in srgb, var(--subject) 22%, transparent); }
  .slot.live .lesson { background: color-mix(in srgb, var(--subject) 12%, var(--card)); }
  .now-pill {
    display: inline-flex; align-items: center; gap: 5px; margin-bottom: 6px;
    padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase;
    background: var(--subject); color: #fff;
  }
  .now-pill i { width: 5px; height: 5px; border-radius: 50%; background: currentColor;
                animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .gap {
    display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
    color: var(--muted); font-size: 12px;
  }
  .gap::before, .gap::after { content: ""; height: 1px; background: var(--line); flex: 1; }
  .empty-day { color: var(--muted); padding: 6px 0 2px; }

  /* ---------- revision ---------- */
  .revise { display: flex; align-items: center; gap: 14px; }
  .ring { position: relative; width: 62px; height: 62px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .val {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .revise .txt { flex: 1; }
  .revise .txt b { display: block; font-size: 17px; }
  .revise .txt span { color: var(--muted); font-size: 13px; }
  .go {
    min-height: var(--tap); padding: 0 18px; border-radius: var(--r-md);
    background: var(--accent); color: var(--accent-text); font-weight: 600;
    transition: opacity 180ms ease;
  }
  .go:active { opacity: .75; }
  .go.wide { width: 100%; margin-top: 10px; }
  .go.ghost { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }

  /* ---------- drills, notes ---------- */
  /* smuga predmetiv */
  .subjects {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 2px; margin: 0 -16px 4px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .subjects::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    background: var(--card); color: var(--muted); font-size: 14px; font-weight: 600;
    transition: background-color 180ms ease, color 180ms ease;
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--muted)); flex: none; }
  .chip.on { color: var(--dot, var(--accent)); background: color-mix(in srgb, var(--dot, var(--accent)) 16%, var(--card)); }
  .chip .count { font-size: 12px; font-weight: 700; opacity: .7; }
  .topic-row {
    display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
    min-height: var(--tap); padding: 8px 0;
  }
  .topic-row .tag {
    flex: none; min-width: 34px; font-size: 12px; font-weight: 700; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .topic-row .name { flex: 1; font-size: 15px; line-height: 1.3; }
  .topic-row .chev { color: var(--muted); flex: none; }
  .topic-row[disabled] { opacity: .5; }
  .empty-note { color: var(--muted); font-size: 14px; padding: 4px 0 2px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
         background: var(--card); padding: 4px; border-radius: var(--r-md); }
  .seg button {
    min-height: 40px; border-radius: var(--r-sm); font-size: 14px; font-weight: 600;
    color: var(--muted); transition: background 180ms ease, color 180ms ease;
  }
  .seg button.on { background: var(--bg); color: var(--text); }
  .flash { min-height: 148px; display: grid; place-content: center; text-align: center; gap: 10px; }
  .flash .front { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; }
  .flash .back { font-size: 17px; color: var(--muted); }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .grades button {
    min-height: var(--tap); border-radius: var(--r-md); font-size: 14px; font-weight: 600;
    color: #fff; transition: opacity 180ms ease;
  }
  .grades button:active { opacity: .75; }
  .g-again { background: var(--bad); } .g-hard { background: var(--warn); }
  .g-good { background: var(--accent); } .g-easy { background: var(--ok); }
  .opt {
    display: block; width: 100%; text-align: left; min-height: var(--tap);
    background: var(--bg); border: 1.5px solid var(--line); border-radius: var(--r-md);
    padding: 12px 14px; margin: 8px 0; transition: border-color 180ms ease, background 180ms ease;
  }
  .opt.correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent);
             transition: transform 240ms ease; transform-origin: left; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .src { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line);
         padding-left: 10px; margin-top: 8px; white-space: pre-wrap; }
  details summary { cursor: pointer; color: var(--accent); font-size: 14px; min-height: 32px;
                    display: flex; align-items: center; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; }
  .row .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px;
               min-width: 46px; flex: none; }
  .row .subject { flex: 1; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px;
          font-weight: 700; background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }

  /* ---------- tab bar ---------- */
  nav {
    position: fixed; z-index: var(--z-nav); left: 0; right: 0; margin-inline: auto;
    width: min(calc(var(--shell) - 24px), calc(100% - 24px));
    bottom: calc(10px + var(--safe-bottom) + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: saturate(180%) blur(18px);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    border: 1px solid var(--line); border-radius: 22px;
    display: grid; grid-template-columns: repeat(4, 1fr);
    box-shadow: 0 6px 24px rgb(0 0 0 / .12);
  }
  nav button {
    position: relative; min-height: 52px; margin: 5px 4px; border-radius: 17px;
    display: grid; justify-items: center; gap: 3px; align-content: center;
    color: var(--muted); font-size: 11px; font-weight: 600;
    transition: color 200ms ease, background-color 200ms ease;
  }
  nav button:active { background: color-mix(in srgb, var(--text) 6%, transparent); }
  nav button svg { width: 22px; height: 22px; stroke-width: 1.9; }
  nav button.on {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 15%, transparent);
  }
  nav button.on svg { stroke-width: 2.2; }
  /* Планшет і монітор: колонка ширшає, але не розповзається. */
  @media (min-width: 800px) {
    :root { --shell: 780px; }
    h1 { font-size: 30px; }
    .card { padding: 18px 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow"><span id="eyebrow">…</span><span class="badge" id="weekBadge"></span></div>
  <h1 id="title">Конспект</h1>
  <button class="screen-toggle" id="screenToggle" hidden aria-label="На весь екран"></button>
</header>
<main id="view"></main>
<nav id="tabs" aria-label="Розділи"></nav>
<script type="module" src="app.js?v=d544f452bc"></script>
</body>
</html>
